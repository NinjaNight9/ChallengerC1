name: ChallengerC1 Rev5 CORE10 Eligibility Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rev5_core10_fix.yml'
      - 'c1/scripts/rev5_core10_eligibility_fix.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  core10-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c1/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r c1/requirements.txt

      - name: Download exact Rev5 value sensitivity inputs
        uses: actions/download-artifact@v4
        with:
          name: challenger-c1-rev5-value-sensitivity
          path: value
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33962051636

      - name: Run corrected CORE10 development/holdout eligibility
        working-directory: c1
        env:
          PYTHONPATH: src
        run: |
          python scripts/rev5_core10_eligibility_fix.py \
            --value-dir ../value \
            --config config/default.json \
            --out-dir reports/rev5_core10_fixed

      - name: Verify frozen eligibility and provenance
        run: |
          python - <<'PY'
          import json
          p='c1/reports/rev5_core10_fixed/CORE10_CORRECTED_EVALUATION.json'
          a=json.load(open(p))
          q=a['core_policy_corrected']
          assert q['fraction_cap'] == 0.10
          assert q['min_history'] == 4.0
          assert q['min_surface_history'] == 2.0
          assert a['selected_history_days'] == 730
          assert a['betting_policy_approved'] is False
          assert a['evaluation_grade'] == 'NON_APPROVAL_GRADE_SENSITIVITY'
          print(json.dumps(a, indent=2, default=str))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: challenger-c1-rev5-core10-corrected
          path: c1/reports/rev5_core10_fixed/
          retention-days: 90
