name: UFCC1 delta data bridge
on:
  push:
    branches: [ufcc1-backtest-live]
    paths:
      - '.github/workflows/ufcc1_gamma_backtest.yml'
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download current UFCStats mirror
        run: |
          mkdir -p delta_bridge
          base=https://raw.githubusercontent.com/Greco1899/scrape_ufc_stats/main
          for f in ufc_event_details.csv ufc_fight_results.csv ufc_fight_details.csv ufc_fight_stats.csv; do
            curl -L --fail --retry 3 -o delta_bridge/$f $base/$f
            wc -l delta_bridge/$f
            sha256sum delta_bridge/$f
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ufcc-delta-raw
          path: delta_bridge/
          if-no-files-found: error
