name: ChallengerC1 Value Evaluation After Odds

on:
  workflow_run:
    workflows: ["TennisExplorer Full Challenger Odds Backfill"]
    types: [completed]
  workflow_dispatch:
    inputs:
      odds_run_id:
        description: "Completed TennisExplorer Full Challenger Odds Backfill run id"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c1/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r c1/requirements.txt

      - name: Resolve odds run id
        id: runid
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.odds_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download combined historical odds
        uses: actions/download-artifact@v4
        with:
          name: tennisexplorer-challenger-odds-combined
          path: odds
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runid.outputs.id }}

      - name: Download frozen fundamental benchmark predictions
        uses: actions/download-artifact@v4
        with:
          name: challenger-c1-fundamental-benchmark
          path: fundamental
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33848535511

      - name: Run leakage-safe value and policy evaluation
        working-directory: c1
        env:
          PYTHONPATH: src
        run: |
          python scripts/evaluate_value_from_fundamental.py \
            --fund-dir ../fundamental \
            --odds ../odds/tennisexplorer_challenger_odds_VALID_2023_2026.csv \
            --config config/default.json \
            --out-dir reports/value_evaluation

      - name: Show compact result
        run: |
          python - <<'PY'
          import json
          p='c1/reports/value_evaluation/FINAL_VALUE_EVALUATION_AUDIT.json'
          a=json.load(open(p))
          print(json.dumps({
            'development_odds_matched':a['development_odds_matched'],
            'holdout_odds_matched':a['holdout_odds_matched'],
            'predictive_holdout':a['predictive_metrics']['holdout'],
            'core10':a['gated_fraction_holdout_results']['0.1']['base'],
            'volume20':a['gated_fraction_holdout_results']['0.2']['base'],
            'forced20':a['forced_fraction_holdout_diagnostics']['0.2']['base'],
            'core10_approved':a['core10_approved_for_prospective_tracking'],
            'volume20_approved':a['volume20_approved_for_prospective_tracking'],
          },indent=2))
          PY

      - name: Upload complete value evaluation
        uses: actions/upload-artifact@v4
        with:
          name: challenger-c1-value-evaluation
          path: c1/reports/value_evaluation/
          retention-days: 90

      - name: Commit compact final audit and frozen policies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChallengerC1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add c1/reports/value_evaluation/FINAL_VALUE_EVALUATION_AUDIT.json \
                  c1/reports/value_evaluation/09_frozen_fraction_policies.json \
                  c1/reports/value_evaluation/07_policy_grid_DEVELOPMENT_ONLY.csv
          if git diff --cached --quiet; then
            echo 'No value-evaluation summary changes.'
          else
            git commit -m 'Record ChallengerC1 untouched value evaluation'
            git push
          fi
