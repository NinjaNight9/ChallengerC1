name: ChallengerC1 Fast Value Evaluation Retry

on:
  push:
    paths:
      - '.github/workflows/value_evaluation_fast_retry.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c1/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r c1/requirements.txt
      - name: Download combined historical odds
        uses: actions/download-artifact@v4
        with:
          name: tennisexplorer-challenger-odds-combined
          path: odds
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33851807176
      - name: Download frozen fundamental benchmark predictions
        uses: actions/download-artifact@v4
        with:
          name: challenger-c1-fundamental-benchmark
          path: fundamental
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33848535511
      - name: Run optimized leakage-safe value evaluation
        working-directory: c1
        env:
          PYTHONPATH: src
        run: |
          python scripts/evaluate_value_from_fundamental.py \
            --fund-dir ../fundamental \
            --odds ../odds/tennisexplorer_challenger_odds_VALID_2023_2026.csv \
            --config config/default.json \
            --out-dir reports/value_evaluation
      - name: Print compact result
        run: |
          python - <<'PY'
          import json
          a=json.load(open('c1/reports/value_evaluation/FINAL_VALUE_EVALUATION_AUDIT.json'))
          print(json.dumps({
            'development_odds_matched': a['development_odds_matched'],
            'holdout_odds_matched': a['holdout_odds_matched'],
            'holdout_predictive': a['predictive_metrics']['holdout'],
            'top10': a['gated_fraction_holdout_results']['0.1']['base'],
            'top15': a['gated_fraction_holdout_results']['0.15']['base'],
            'top20': a['gated_fraction_holdout_results']['0.2']['base'],
            'top25': a['gated_fraction_holdout_results']['0.25']['base'],
            'top30': a['gated_fraction_holdout_results']['0.3']['base'],
            'forced20': a['forced_fraction_holdout_diagnostics']['0.2']['base'],
            'core10_approved': a['core10_approved_for_prospective_tracking'],
            'volume20_approved': a['volume20_approved_for_prospective_tracking'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: challenger-c1-value-evaluation-fast
          path: c1/reports/value_evaluation/
          retention-days: 90
